<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>TV Libre</title>
  <meta name="description" content="Lecteur de chaînes TV en direct (listes M3U), AirPlay et image dans l'image.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TV Libre">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Écran principal : liste des chaînes -->
  <div id="home">
    <header class="home-top">
      <button class="icon-btn" id="btn-settings" aria-label="Réglages"><svg><use href="#i-gear"/></svg></button>
      <h1>TV Libre</h1>
      <span class="exit" id="exit-badge"></span>
    </header>
    <div class="search">
      <svg><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Chercher une chaîne" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <main id="list" aria-live="polite"></main>
  </div>

  <!-- Feuilles (réglages, actions, programme) -->
  <div id="sheet" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button class="text-btn" id="sheet-close">OK</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <!-- Lecteur -->
  <div id="player" class="player" hidden>
    <div class="rotor" id="rotor">
      <div class="pbar">
        <button class="icon-btn" data-act="close" aria-label="Fermer"><svg><use href="#i-down"/></svg></button>
        <div class="ptitle"><b class="p-name"></b><small class="p-sub"></small></div>
        <button class="icon-btn" data-act="panel" aria-label="Liste des chaînes"><svg><use href="#i-list"/></svg></button>
        <span class="grow"></span>
        <button class="icon-btn" data-act="streams" aria-label="Flux"><svg><use href="#i-sliders"/></svg></button>
      </div>
      <div class="stage" id="stage">
        <video id="video" playsinline x-webkit-airplay="allow" autopictureinpicture></video>
        <div class="controls" id="controls">
          <button class="big-play" data-act="play" aria-label="Lecture"><svg class="ic-play"><use href="#i-play"/></svg><svg class="ic-pause"><use href="#i-pause"/></svg></button>
          <div class="pill">
            <button class="icon-btn" data-act="close" aria-label="Fermer"><svg><use href="#i-down"/></svg></button>
            <button class="icon-btn" data-act="panel" aria-label="Liste des chaînes"><svg><use href="#i-list"/></svg></button>
            <div class="ptitle"><b class="p-name"></b><small class="p-sub"></small></div>
            <button class="icon-btn" data-act="streams" aria-label="Flux"><svg><use href="#i-sliders"/></svg></button>
          </div>
          <div class="cbar">
            <span class="live"><i></i>DIRECT</span>
            <span class="grow"></span>
            <button class="icon-btn" data-act="airplay" id="btn-airplay" aria-label="AirPlay" hidden><svg><use href="#i-airplay"/></svg></button>
            <button class="icon-btn" data-act="rotate" aria-label="Paysage / portrait"><svg><use href="#i-rotate"/></svg></button>
          </div>
        </div>
        <div class="zap" id="zap" hidden></div>
        <div class="panel" id="panel" hidden></div>
        <div class="perror" id="perror" hidden></div>
        <div class="modal" id="modal" hidden>
          <div class="modal-card">
            <div class="sheet-head"><h2 class="modal-title"></h2><button class="text-btn" data-act="modal-close">OK</button></div>
            <div class="modal-body"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- Icônes -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-gear" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zM12 2.5v2.3M12 19.2v2.3M4.2 6l1.7 1.6M18.1 16.4l1.7 1.6M2.5 12h2.3M19.2 12h2.3M4.2 18l1.7-1.6M18.1 7.6 19.8 6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M10.5 4a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zM15.5 15.5 20 20"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.2v13.6a.8.8 0 0 0 1.2.7l10.6-6.8a.8.8 0 0 0 0-1.4L9.2 4.5A.8.8 0 0 0 8 5.2z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></symbol>
    <symbol id="i-airplay" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M6 17H4.5A1.5 1.5 0 0 1 3 15.5v-9A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v9a1.5 1.5 0 0 1-1.5 1.5H18"/><path fill="currentColor" d="m12 14 5 6H7z"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M8 3.5c2-1 5-1 7 .5M15 4l.3-2.2M15 4l-2.2.3"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></symbol>
    <symbol id="i-star-fill" viewBox="0 0 24 24"><path fill="currentColor" d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></symbol>
    <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M9 3l3 3 3-3"/></symbol>
  </svg>

  <script type="module" src="js/main.js"></script>
</body>
</html>
